<!doctype html>
<html>
  <head>
    <title>Conversion Context Search</title>
    <style>
      body {
        min-width: 300px;
        font-size: 15px;
        text-align: center;
      }

      input {
        margin: 5px;
        outline: none;
      }

      button {
        border-radius: 4px;
        border: none;
        background-color: #44bdad;
        color: #FFFFFF;
        padding: 2px;
      }

      button:hover {
        background-color: #d53a4f;
      }

      #switch {
        display: none;
      }
    </style>
  </head>

  <body>
    <h2>Better Conversions</h2>
    <p id="conversion">Select something to convert.</p>
    
    <div id="switch">
      <input type="radio" id="option1" name="conversion_option" value="bananas">
      <label for="option1" id="option1_label">Bananas</label><br>
      <input type="radio" id="option2" name="conversion_option" value="two_story">
      <label for="option2" id="option2_label">2-story buidling</label><br>

      <button onclick="convert"> CONVERT </button>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
